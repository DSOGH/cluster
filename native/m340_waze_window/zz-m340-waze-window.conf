# The Waze on cluster map in the M340i Sport layout's window (DSOGH/cluster, native/m340_waze_window).
# The map goes on the whole-panel target the layout draws on, at the layout's window, instead of the map
# slot under the layout, where the KOMBI draws its own map screen over it. Removed with the tool.
[Service]
ExecStart=
ExecStart=/var/opt/waze-on-cluster/current/waze-on-cluster -c /var/opt/waze-on-cluster/current/waze-on-cluster.conf -s target=panel -s map_rect=416,128,1088,480 $WOC_SRC_CROP
